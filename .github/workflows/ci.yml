name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      NODE_ENV: test
      APP_NAME: ShopCore
      APP_URL: http://localhost:3000
      DATABASE_URL: "file:../data/store.db"
      SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CSRF_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SHOPCORE_ALLOW_TEST_EMAILS: "1"
      BOOTSTRAP_ADMIN_EMAIL: admin@shopcore.internal
      BOOTSTRAP_ADMIN_PASSWORD: ShopCoreAdmin#2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Database Migrations
        run: npx prisma migrate deploy

      - name: Seed Database
        run: |
          npm run db:seed
          npm run db:seed:products

      - name: Run ESLint
        run: npm run lint

      - name: Run Master Verification Test Suite
        run: npm test

      - name: Run Next.js Production Build
        run: npm run build
